name = "lean_to_lambdabox"
version = "0.1.0"
defaultTargets = ["LeanToLambdaBox"]

# Grounds the verified-erasure development on lean4lean's formal Lean type theory
# (`VExpr`, `HasType`/`IsDefEq`, `TrExprS`/`VLCtx`, `TrEnv`, `inferType'.WF`).
#
# The pin is the head of the `trproj` branch of the barabbs/lean4lean fork, which extends
# upstream (digama0/lean4lean) with ι-reduction support and a definition of `TrProj`. It is
# on the v4.33.0-rc2 toolchain (matching `lean-toolchain`) and pulls batteries v4.33.0-rc2
# transitively.
#
# The `sorry` roots this pin makes inheritable are listed, with `file:line`, in
# `doc/trust.md`; `scripts/lean4lean-sorries.sh` re-measures them against
# `test/lean4lean-sorries.expected`, so a re-pin or a new upstream hole fails CI.
[[require]]
name = "lean4lean"
git = "https://github.com/barabbs/lean4lean"
rev = "20ec229f1a8c6358f3b3852c4e27d2be523d1b87"

[[lean_lib]]
name = "LeanToLambdaBox"

# The benchmark corpus and the green ladder's spike modules. A program is split in two:
# `VerifyBench/Src/<P>.lean` declares it and is a plain library module, byte-frozen against
# the sibling `benchmarks` repo and against `test/frozen/` by `scripts/frozen.sh`;
# `VerifyBench/<P>.lean` imports it and runs one `#erase` (`csimp := false`, which every
# correctness theorem requires — finding D1 — writing under `VerifyBench/ast/`). The split
# is what lets a rung name its subject: `LeanToLambdaBox/Green.lean` imports
# `VerifyBench.Src.Arith`. Deliberately NOT in `defaultTargets`: `lake build` is unchanged,
# and elaborating the roots and the spikes writes `.ast` files, which CI should not do.
# Build with `lake build VerifyBench` from the repo root.
[[lean_lib]]
name = "VerifyBench"
roots = [
  "VerifyBench.Arith",
  "VerifyBench.Sieve",
  "VerifyBench.Quicksort",
  "VerifyBench.BinaryTrees",
  "VerifyBench.Fannkuch",
  "VerifyBench.Spikes.G1",
  "VerifyBench.Spikes.G2",
  "VerifyBench.Spikes.G3",
  "VerifyBench.Spikes.G4",
  "VerifyBench.Spikes.G5",
  "VerifyBench.Spikes.G6",
  "VerifyBench.Spikes.G7",
  "VerifyBench.Spikes.G8",
  "VerifyBench.Src.Arith",
  "VerifyBench.Src.Sieve",
  "VerifyBench.Src.Quicksort",
  "VerifyBench.Src.BinaryTrees",
  "VerifyBench.Src.Fannkuch",
]

# The external half of the green ladder (`Tools/GreenCheck.lean`): the checks that
# have to run outside the kernel. Today `--self-test` exercises `lbEval`.
[[lean_exe]]
name = "green-check"
root = "Tools.GreenCheck"

# Table drift detection (`Tools/Reify.lean`): `--check MOD NAME…` compares a committed
# `SourceTable` field-by-field against the environment `MOD` elaborated in.
[[lean_exe]]
name = "reify"
root = "Tools.Reify"
# Reads a compiled `SourceTable` out of an imported module, so it runs the interpreter.
supportInterpreter = true

# Repository hygiene (`Tools/Hygiene.lean`): duplicate-name, deletion-schedule, comment,
# citation, rule-table and dead-code checks. Run from the repository root.
[[lean_exe]]
name = "hygiene"
root = "Tools.Hygiene"

# The coverage document (`Tools/Coverage.lean`): regenerates `doc/coverage.md` from the
# tree, and `--check` fails when the committed document has drifted from the measurement.
[[lean_exe]]
name = "coverage"
root = "Tools.Coverage"
# Reifies a `SourceTable` out of an imported module, so it runs the interpreter.
supportInterpreter = true
