name: Build
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
    - 'ml/translate'
    paths-ignore:
    - '**.md'
    - 'LICENSE'
  pull_request:
    paths-ignore:
    - '**.md'
    - 'LICENSE'
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}"
  cancel-in-progress: true
permissions:
  contents: read
env:
  JOBS: 4
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v7

      # Fetches the Mathlib cache and builds the eraser and the Metalean modules it imports in the
      # step whose `.lake` lean-action caches, so later runs replay Metalean instead of rebuilding it.
      - name: Set up Lean and build
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: true
          build: true
          build-args: "LeanToLambdaBox LeanToLambdaBox.Metalean"
          test: false
          lint: false

      - name: Regression tests
        run: scripts/regress.sh
