name: Build
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
    paths-ignore:
    - '**.md'
    - 'LICENSE'
  pull_request:
    paths-ignore:
    - '**.md'
    - 'LICENSE'
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}"
  cancel-in-progress: true
permissions:
  contents: read
env:
  JOBS: 4
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v7

      # Builds the eraser and the lean4lean libraries of the dependency in the step whose `.lake`
      # lean-action caches, so later runs replay lean4lean instead of rebuilding it.
      - name: Set up Lean and build
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          build: true
          build-args: "LeanToLambdaBox Lean4Lean Lean4Lean.Theory Lean4Lean.Verify"
          test: false
          lint: false

      - name: Shipping regression tests
        run: scripts/regress.sh

      - name: Pure path next to the Meta path on the corpus
        run: scripts/pure-harness.sh
