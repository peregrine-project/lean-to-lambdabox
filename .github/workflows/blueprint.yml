# Builds and publishes the leanblueprint under blueprint/. doc-gen4 is intentionally
# not built (no lakefile dependency on it, and there is no home_page/), so the
# \lean{} links in the web version do not resolve to a docs site.

name: Compile blueprint

on:
  push:
    branches:
      - dev/blueprint # Trigger on pushes to the blueprint branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build blueprint
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Lean and build
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-github-cache: false   # no Mathlib here; nothing worth caching
          use-mathlib-cache: false

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-extra latexmk

      - name: Install leanblueprint
        run: |
          python3 -m venv .venv
          .venv/bin/pip install leanblueprint

      - name: Build blueprint PDF and web
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          leanblueprint pdf
          leanblueprint web

      - name: Check blueprint declarations
        run: lake env lean --run blueprint/CheckDecls.lean blueprint/lean_decls

      - name: Audit blueprint (labels, uses graph, leanok policy, trust edges vs #print axioms)
        run: python3 blueprint/scripts/audit.py

      - name: Copy PDF into web output
        run: cp blueprint/print/print.pdf blueprint/web/print.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
