"Metalean.Decide" = 'Decidability instances for the side conditions of entries, among them large elimination (\code{Inductive.LargeElim}).'
"Metalean.Level.Quot.Nat" = 'The arithmetic of level evaluation on \code{Nat} (\leandecl{Nat.imax}).'
"Metalean.Level.Quot.Order" = 'The order of levels: a join semilattice under \code{max}.'
"Metalean.Syntax.Eq" = 'The inductive block of \code{Eq} that the quotient constants require (\code{Eq.block}).'
