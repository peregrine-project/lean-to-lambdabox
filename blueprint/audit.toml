# Configuration of blueprint/scripts/audit.py.

# The directory whose `lake env` resolves every module of `imports` (the proof package sees the
# root package, con-leche and itself).
env_dir = "proof"

# Modules imported to check the blueprint: every \lean{} name of a node that is not planned must
# be a declaration of this environment. `X.*` stands for the module X and all its submodules (read
# from the source trees of the root package, of the proof package and of the packages under
# .lake/packages). con-leche's modules come in through these imports (ConLeche.MainTheorem through
# LeanToLambdaBox.ConLeche); its bridge/ package is not a dependency.
imports = ["LeanToLambdaBox", "LeanToLambdaBox.ConLeche", "EraseProof.*"]

# Axioms a node may depend on and still carry \leanok. No sorry is allowed: audit.toml lists no
# [[inherited_sorry]], so a node that reaches sorryAx (or any other axiom) has no \leanok.
standard_axioms = ["propext", "Classical.choice", "Quot.sound"]

# Module prefix of the inherited development (con-leche, at the revision of lake-manifest.json). The census of the trust chapter lists its
# sorry sources (declarations whose own type or value uses sorryAx) and axioms in the environment.
inherited_prefix = "ConLeche"

# The final theorem. scripts/kinds.py gives the node that cites it the kind final, planned until
# it lands. proof/ROOTS.txt marks it FINAL then; a stand-alone result has the same mark.
final_theorem = "EraseProof.erase_correct"

# Module prefix of the shipping code, whose partial and monadic declarations the trust chapter
# tabulates.
shipping_prefix = "LeanToLambdaBox"

# Module prefix of the verification modules whose declarations a node must cite (a user-written
# declaration of a module with this prefix is cited by a node that is not planned). The prefix names
# the statements module; the chapters that document the other modules extend it.
cover_prefix = "EraseProof"

# The no-leaves register of the proof package, rendered as a table (relative to the repository
# root).
roots_file = "proof/ROOTS.txt"

# Name prefix of the tests. A node whose declarations all have this prefix is a test node.
test_prefix = "EraseProof.Test."

# Lake builds run before the audit: `lake build <targets>` in each directory (relative to the
# repository root). The root package holds the eraser and requires con-leche; the proof package
# `proof/` holds the verification library and requires the root package by path.
[[build]]
dir = "."
targets = ["LeanToLambdaBox", "LeanToLambdaBox.ConLeche"]

[[build]]
dir = "proof"
targets = ["EraseProof"]

# The ConLeche modules whose declarations the proof library (outside its tests) or the shipping
# code uses directly, with what each provides (TeX, ASCII). scripts/audit.py --update writes one
# node per module (generated/conleche-imports.tex, in the trust chapter): its declarations used
# directly, its axioms as measured, and the nodes that use it. The audit checks that every such
# module, and no other, has an entry here.
[conleche_modules]
"ConLeche.Denotes" = 'The set-model denotation relation (\code{Denotes}), with its valuations of bound variables (\code{BVarIdx}) and universe parameters (\code{LevelParam}).'
"ConLeche.Kernel.CheckDecl" = 'The pure fold over declarations (\code{checkDeclsPure}).'
"ConLeche.Kernel.CheckerBase" = 'The fuelled operations of the checker (\code{fueledOps}).'
"ConLeche.Kernel.Core" = 'The fuel of the full-grade checker (\code{checkFuel}).'
"ConLeche.Kernel.Env" = 'Environments (\code{Env}) of declarations, and the checker modes (\code{CheckMode}).'
"ConLeche.Kernel.Error" = 'The checker monad (\code{CheckM}) and its errors (\code{CheckError}).'
"ConLeche.Kernel.Expr" = 'The checker expressions (\code{Expr}): no binder names or infos, no metavariables.'
"ConLeche.Kernel.ExprOps" = 'Operations on checker expressions: head of a spine, free variables, instantiation of a bound variable.'
"ConLeche.Kernel.Level" = 'Levels: instantiation of universe parameters, and zero under every valuation (\code{isAlwaysZero}).'
"ConLeche.Kernel.Name" = 'Checker names (\code{Name}) and the conversion from Lean names (\code{Name.ofLeanName}).'
"ConLeche.Kernel.NatOpPinSet" = 'The set of pinned \code{Nat} operations of the checker (\code{NatOpPinSet}).'
"ConLeche.Kernel.TypeChecker" = 'The weak-head reduction (\code{whnf}) and type inference (\code{inferTypeCore}).'
"ConLeche.Model.Capstone" = 'The inputs of the rules of con-leche, from a set-theory model (\code{RulesInputs.ofSem}).'
"ConLeche.Model.Claims" = 'The claims of reduction, definitional equality and inference in a model (\code{WhnfClaim}, \code{DefEqClaim}, \code{InferClaim}).'
"ConLeche.Model.ClaimsIO" = 'The inference claim for the checker run in \code{IO} (\code{InferClaimIO}).'
"ConLeche.Model.Denotes" = 'The model of an environment as a model of expressions (\code{Model.ofEnvModelM}).'
"ConLeche.Model.Env.EnvModelM" = 'Models of an accepted environment (\code{Model.EnvModelM}), the invariant behind the soundness theorem.'
"ConLeche.Model.Fold" = 'Soundness of the pure fold (\code{checkDeclsPure\_sound\_of}): an accepted environment has a model.'
"ConLeche.Model.Rules.Recompose" = 'The soundness of the moves of the checker at every fuel (\code{checkSoundAtP5}).'
"ConLeche.Semantics.DeclWF" = 'Well-formedness of an environment the pure fold returns (\code{checkDeclsPure\_envWF}).'
"ConLeche.SetTheory.Core" = 'The class of set-theoretic universes (\code{SetTheory}), which the meaning claim quantifies over.'
"ConLeche.SetTheory.Derive.Pt" = 'The proof point of the model (\code{SetTheory.pt}).'
"ConLeche.Verify.EnvWF" = 'The syntactic well-formedness of an environment (\code{EnvWF}).'
"ConLeche.Verify.Inductives.RecCheckScope" = 'Inferred types are closed (\code{infer\_full\_bvarClosed}).'
"ConLeche.Verify.Rules.Bridge" = 'The bridge from accepting runs to the relations of the checker (\code{inferTypeCore\_bridge}).'
"ConLeche.Verify.Subst" = 'Agreement of the two instantiations of the checker (\code{instantiate1Lift\_eq\_instantiate1}).'
"ConLeche.Kernel.Basis.Builder" = 'The term builders of the basis declarations (\code{BasisDSL.ap2}, \code{ap4}, \code{bv}).'
"ConLeche.Kernel.Basis.Nat" = 'The pinned \code{Nat} basis (\code{natA}, \code{natBasis}, \code{natRecA}).'
"ConLeche.Kernel.Basis.Quot" = 'The pinned quotient basis (\code{quotA}, \code{quotIndMk}, \code{quotIndMotive}).'
"ConLeche.Kernel.Inductives.StructInstall" = 'The check of the field domains by the structure installer (\code{checkStructDomsAt}).'
"ConLeche.Model.Env.Laws" = 'The non-zero family of an environment model (\code{Model.FamNZ}).'
"ConLeche.Model.Rules.CertsSound" = 'The soundness of the telescope arity of the certificates (\code{Model.Rules.teleArity\_sound}).'
"ConLeche.Model.Rules.IotaSound" = 'The semantic soundness of the $\iota$ step (\code{Red.iota\_sound}).'
"ConLeche.Model.Rules.RedSound" = 'The soundness of transitivity of the reduction relation (\code{Red.trans\_sound}).'
"ConLeche.Verify.EnvPreds" = 'The universe-level shorthands of the environment predicates (\code{uN}, \code{vN}).'
"ConLeche.Verify.Inductives.ClassMatchRun" = 'Equivalence of lists in the class match (\code{isEquivList\_self}).'
"ConLeche.Verify.Inductives.DirectInv" = 'The direct invariant of the sum constructors (\code{FieldSorts}, \code{SumCtorRun}, \code{SumCtorsRun}).'
"ConLeche.Verify.Knot" = 'The fuelled full-grade $\iota$ certificates (\code{iotaCertsFullFueled}).'
"ConLeche.Verify.PropWhen" = 'The soundness of the zero-ness test of a sort (\code{PropWhen.zeronessOf\_sound}).'
"ConLeche.Verify.Rules.Certs" = 'The bridge from the full $\iota$ certificates to the rules tier (\code{Rules.iotaCertsFull\_bridge}).'
"ConLeche.Verify.Rules.Defs" = 'The bridge theorems of the rules tier (\code{DefEqBridge}, \code{InferBridge}, \code{InferIOBridge}).'

